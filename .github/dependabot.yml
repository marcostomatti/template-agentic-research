version: 2

# Dependency bump cadence. Two ecosystems, both rooted at "/": bun resolves
# the whole workspace from the single root bun.lock, and Dependabot reads
# workflow files relative to the repo root.
#
# The ecosystem is `bun`, not `npm`. The lockfile here is bun.lock (there is
# no package-lock.json anywhere in the tree) and the npm ecosystem does not
# read it, so an `npm` entry would resolve nothing at all. Dependabot's bun
# support wants bun >= 1.1.39; package.json pins bun@1.3.9.
#
# Every PR this file opens lands on an existing gate today: back.yml and
# front.yml each list 'package.json' and 'bun.lock' in their paths: filters,
# and each also lists its own workflow file. The gap is deploy-back.yml,
# which neither filter names: harmless while its only two actions (checkout,
# setup-bun) are shared with the gated workflows, but a bump to an action
# used ONLY there would open a PR no gate runs on. Add that path to
# back.yml's paths: lists if the operator section ever grows an action
# of its own.

updates:
  # Runtime and toolchain dependencies for the root and every packages/*
  # workspace — one entry, because one lockfile resolves them all.
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly

    # Majors are deliberately left OUT of the group so each arrives alone.
    # The catch-up that produced this file needed its own reconcile commits
    # per major (express 5, zod 4, pino 10, helmet 8, express-rate-limit 8),
    # and one of them moved an API-visible error message; batched, a red
    # gate would not say which bump caused it. Patch and minor carry no such
    # cost, so they share one PR and one CI run.
    groups:
      bun-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

    # The grouped PR plus headroom for a few majors. The cap delays work
    # rather than losing it — Dependabot reopens whatever it dropped on
    # the next run — while a higher one queues more branches than a merge
    # window absorbs.
    open-pull-requests-limit: 5

    # Playwright is pinned in three places and no bot can move all three.
    # @ar/ui pins playwright and playwright-core to an exact 1.61.1; it
    # repeats both in an overrides block, which is load-bearing rather than
    # belt-and-braces (two transitive consumers declare ranges wide enough
    # to float them); and front.yml spells the version into its
    # visual-baseline cache key three times over as the literal `pw1.61.1`
    # — the restore key, the restore-keys prefix and the save key. Those
    # baselines exist ONLY in that cache and are untracked, so a manifest
    # bump the key cannot follow installs a 1.62 browser and then restores
    # 1.61.1 renderings to compare it against: a false diff on every story
    # whose rendering moved, not the clean cache miss that would re-seed
    # and pass. Bump this by hand, cache key first.
    ignore:
      - dependency-name: playwright
      - dependency-name: playwright-core

      # ESLint 10 and TypeScript 7 are both blocked UPSTREAM — measured,
      # not assumed — so these hold the MAJOR only and keep taking every
      # minor and patch. Each names the one package to watch.
      #
      # eslint 10.9.1 (PR #24): its `test` and `visual` jobs pass and only
      # `checks` fails, and not on anything in this repo's config.
      # eslint-plugin-react 7.37.5 is the LATEST published release, its
      # eslint peer range stops at ^9.7, and it calls
      # `context.getFilename()`, which ESLint 10 removed — the job dies
      # `TypeError: context.getFilename is not a function` while loading
      # `react/jsx-filename-extension`. typescript-eslint already accepts
      # ^10.0.0, so eslint-plugin-react is the whole of the block. Revisit
      # when it publishes a release declaring an eslint-10 peer.
      - dependency-name: eslint
        update-types:
          - version-update:semver-major

      # typescript 7.0.2 (PR #23): the native rewrite drops the JavaScript
      # Compiler API, so @ar/ui's vite build dies inside unplugin-dts
      # before any gate reads a type — "does not provide the JavaScript
      # Compiler API ... and the fallback @typescript/typescript6 was not
      # found". That fallback IS published (6.0.2), but adding it fixes
      # only the build: typescript-eslint pins
      # `typescript: >=4.8.4 <6.1.0`, so the entire lint fan-out is out of
      # range on 7.x whatever the build does. Two upstreams, not one, which
      # is why this is a hold rather than an afternoon. Revisit when
      # typescript-eslint widens that range.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  # The workflow files themselves. Every action here is pinned to a major
  # tag (actions/checkout@v4, oven-sh/setup-bun@v2, actions/github-script@v7
  # and four more), and a major tag already absorbs its own patch and minor
  # releases, so in practice this entry opens major PRs and little else. The
  # group still earns its place: it is what stops a future full-version or
  # commit-SHA pin from opening one PR per action.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

    # Seven distinct action refs (six repos) across three workflows. A major
    # moves CI itself, so they are reviewed one at a time.
    open-pull-requests-limit: 3
