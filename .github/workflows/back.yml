name: Back

# Backend pipeline: root tooling (tools/ralph) + @ar/service. Isolated suite
# only, on GitHub-hosted runners: no databases, no external dependencies, no
# credentials. The live/integration suite (packages/service/tests/live/,
# `bun run test:live`) is deliberately NOT run here — it needs docker-compose
# services. Run it locally (see packages/service/AGENTS.md "Testing") or wire
# a self-hosted job.

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/service/**'
      - 'tools/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.base.json'
      - 'tsconfig.json'
      - 'eslint.base.mjs'
      - 'eslint.config.mjs'
      - 'sharedRules.mjs'
      - 'unsafeUnicode.mjs'
      - 'vitest.config.ts'
      - '.github/workflows/back.yml'
  push:
    branches: [main]
    paths:
      - 'packages/service/**'
      - 'tools/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.base.json'
      - 'tsconfig.json'
      - 'eslint.base.mjs'
      - 'eslint.config.mjs'
      - 'sharedRules.mjs'
      - 'unsafeUnicode.mjs'
      - 'vitest.config.ts'
      - '.github/workflows/back.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      # Byte-level floor before anything else: no raw control bytes or
      # invisible/bidi codepoints in any tracked file. Runs on the bare
      # checkout — node builtins only, no install.
      - name: Control-byte gate
        run: bun tools/control-byte-gate/control-byte-gate.ts

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (root + service)
        run: bun run lint && bun run --filter '@ar/service' lint

      - name: Type-check (root + service)
        run: bun run check-types && bun run --filter '@ar/service' check-types

      - name: Tests (ralph + service isolated suite)
        run: bun run test && bun run --filter '@ar/service' test
