name: Deploy Back

# Manually triggered. Cloud targets, credentials, and the actual deploy
# mechanism are on the operator's purview — the steps below build the image
# and stop where the infrastructure begins.
#
# To deploy automatically on merge instead, uncomment the push trigger:
#
# on:
#   push:
#     branches: [main]
#     paths: ['packages/service/**']

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      # Release gate: refuse to ship an image built from a tree carrying
      # raw control bytes or invisible/bidi codepoints. Bare checkout —
      # node builtins only, no install.
      - name: Control-byte gate
        run: bun tools/control-byte-gate/control-byte-gate.ts

      # Workspace build: the lockfile lives at the repo root, so the build
      # context is the root and the Dockerfile lives in the package.
      - name: Build image
        run: docker build -f packages/service/Dockerfile -t ar-service:${{ github.sha }} .

      # ── Operator's section ─────────────────────────────────────────────
      # Push the image to your registry and roll it out. Examples:
      #
      # - name: Push to registry
      #   run: |
      #     docker tag ar-service:${{ github.sha }} $REGISTRY/ar-service:${{ github.sha }}
      #     docker push $REGISTRY/ar-service:${{ github.sha }}
      #
      # - name: Roll out
      #   run: ssh deploy@host 'docker pull … && docker compose up -d'
      - name: Deploy target not configured
        run: |
          echo "Image built. Configure your registry push + rollout in .github/workflows/deploy-back.yml."
          exit 0
